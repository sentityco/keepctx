<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Context not found — KeepCTX</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="/style.css" />
<style>
.nf{padding:64px 0 56px}
.code404{font-family:var(--mono);font-size:15px;color:var(--dim);margin:0 0 10px;letter-spacing:.5px}
.code404 b{color:var(--acc);font-weight:700}
.nf h1{margin-bottom:14px}
.nf .lede{margin-bottom:0}
.path{word-break:break-all}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="logo" href="/"><img src="/logo.png" alt="KeepCTX" width="148" height="36" /></a>
  <nav>
    <a href="/#how">How it works</a>
    <a href="/#quickstart">Quickstart</a>
    <a href="https://github.com/sentityco/keepctx">GitHub</a>
  </nav>
</div></header>

<div class="nf"><div class="wrap">
  <p class="code404"><b>404</b> · context not found</p>
  <h1>This page didn't survive the session.</h1>
  <p class="lede">Whatever was at <code class="path" id="path">this address</code>, nobody wrote it
  down, so it's gone. Your AI does the same thing to your project every time a session ends.</p>

</div></div>

<footer><div class="wrap">
  <a href="https://github.com/sentityco/keepctx">GitHub</a> ·
  Apache-2.0 · free and open source
</div></footer>
<script>
  // show the address that wasn't found; without JS the text just says "this address"
  try { var p = decodeURIComponent(location.pathname); if (p.length > 60) p = p.slice(0, 57) + "..."; if (p && p !== "/") document.getElementById("path").textContent = p; } catch (e) {}
</script>
</body>
</html>
